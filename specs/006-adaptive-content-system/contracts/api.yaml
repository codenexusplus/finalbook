openapi: 3.0.0
info:
  title: AI-Native Identity & Adaptive Content System API
  version: 1.0.0
  description: API for user authentication, profile management, and AI-driven content adaptation.
paths:
  /api/translate:
    post:
      summary: Translate Markdown content from English to Urdu using an LLM.
      tags:
        - Translation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                markdown_content:
                  type: string
                  description: "The English Markdown content to be translated."
              required:
                - markdown_content
      responses:
        '200':
          description: Translation successful. Returns translated Markdown content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  translated_content:
                    type: string
        '400':
          description: Bad request (e.g., missing content).
        '500':
          description: Internal server error (e.g., LLM service unavailable).

  /api/profile:
    put:
      summary: Update user profile information.
      description: Allows an authenticated user to update their hardware and software skill profile.
      tags:
        - Profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileRead'
        '401':
          description: Unauthorized.
        '400':
          description: Bad request (e.g., invalid profile data).

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fastapi-users-auth # Assuming session management via cookie from FastAPI-Users

  schemas:
    HardwareProfile:
      type: object
      properties:
        rtx_gpu_model:
          type: string
          example: "RTX 3080"
        vram_gb:
          type: integer
          example: 10
        jetson_device:
          type: string
          example: "Jetson Nano"

    SoftwareSkillLevel:
      type: object
      properties:
        ros_experience:
          type: string
          enum: ["Beginner", "Intermediate", "Advanced"]
          example: "Intermediate"

    Preferences:
      type: object
      properties:
        preferred_language:
          type: string
          enum: ["English", "Urdu"]
          example: "English"
        difficulty_level:
          type: string
          enum: ["Easy", "Medium", "Hard"]
          example: "Medium"

    ProfileUpdate:
      type: object
      properties:
        hardware:
          $ref: '#/components/schemas/HardwareProfile'
        software_skill_level:
          $ref: '#/components/schemas/SoftwareSkillLevel'
        preferences:
          $ref: '#/components/schemas/Preferences'

    UserProfileRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        profile:
          $ref: '#/components/schemas/ProfileUpdate'
      required:
        - id
        - email
