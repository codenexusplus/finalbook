openapi: 3.0.0
info:
  title: User Identity and Profile API
  version: 1.0.0
  description: API for user authentication, session management, and profile orchestration.
paths:
  /auth/login:
    post:
      summary: Login for existing users.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: "User's email address."
                password:
                  type: string
      responses:
        '200':
          description: Login successful. Returns an access token in a secure cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
        '400':
          description: Bad request (e.g., invalid credentials).

  /auth/logout:
    post:
      summary: Logout for authenticated users.
      tags:
        - Authentication
      responses:
        '200':
          description: Logout successful. The session cookie is cleared.

  /auth/register:
    post:
      summary: Register a new user.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: Bad request (e.g., email already exists).

  /users/me:
    get:
      summary: Get current user's details.
      security:
        - cookieAuth: []
      tags:
        - Users
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'

  /users/me/profile:
    put:
      summary: Create or update the user's profile.
      security:
        - cookieAuth: []
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fastapi-users-auth

  schemas:
    ProfileUpdate:
      type: object
      properties:
        hardware:
          type: object
          properties:
            rtx_gpu_model:
              type: string
            ram_gb:
              type: integer
            jetson_device:
              type: string
        software_skill_level:
          type: object
          properties:
            ros2_experience:
              type: string
            python_proficiency:
              type: string
        preferences:
          type: object
          properties:
            preferred_language:
              type: string
            difficulty_level:
              type: string

    UserBase:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    UserCreate:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            password:
              type: string
          required:
            - password

    UserRead:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            is_active:
              type: boolean
            is_superuser:
              type: boolean
            is_verified:
              type: boolean
            profile:
              $ref: '#/components/schemas/ProfileUpdate' # Re-using for structure
          required:
            - id
            - is_active
            - is_superuser
            - is_verified
