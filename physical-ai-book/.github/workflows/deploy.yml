# File: .github/workflows/deploy.yml

name: Deploy Docusaurus to GitHub Pages

on:
  push:
    # Trigger the workflow only when pushing to the main branch
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to deploy pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure that only the latest build is deployed
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Job to build the Docusaurus site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Use npm caching

      - name: Install Dependencies
        run: npm install

      - name: Build Docusaurus Static Site
        # The build command compiles the Markdown content into static HTML/CSS/JS
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The Docusaurus build output is always placed in the 'build' directory
          path: './build'

  # Job to deploy the built artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
